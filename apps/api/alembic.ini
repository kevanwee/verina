# Alembic CLI config for the Verina API (ADR 004). Run from apps/api:
#   python -m alembic upgrade head      # uses VERINA_DATABASE_URL (default: SQLite in .data/)
#   python -m alembic downgrade base
# sqlalchemy.url is intentionally unset: env.py reads it from settings.
[alembic]
script_location = %(here)s/src/verina/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
